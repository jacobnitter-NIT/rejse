<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipt Box</title>
<meta name="theme-color" content="#14213d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#eceff3;--paper:#fff;--ink:#14213d;--mute:#667085;--line:#cfd6e0;--hi:#ffd23f;--hiink:#14213d;--btn:#14213d;--btnink:#fff;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--paper:#17202f;--ink:#e8edf5;--mute:#93a0b5;--line:#2c384c;--hi:#ffd23f;--hiink:#14213d;--btn:#ffd23f;--btnink:#14213d;--bad:#ff8a7a}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto;padding:0 14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:22px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.add .btn{flex:1 1 30%}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mute);margin-bottom:16px}
.drop.on{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 18%,transparent)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.tools input,.tools select,dialog input,dialog select,dialog textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.tools input{grid-column:1/-1}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);padding:8px 2px;font-size:14px}
.meta label{display:flex;gap:8px;align-items:center;cursor:pointer}
.tape{background:var(--paper);border-radius:4px;box-shadow:0 1px 0 var(--line);padding:4px 0;position:relative}
.tape:before,.tape:after{content:"";position:absolute;left:0;right:0;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px}
.tape:before{top:-8px;transform:scaleY(-1)}.tape:after{bottom:-8px}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row.s{background:var(--hi);color:var(--hiink)}
.row.s .mute{color:inherit;opacity:.75}
.row input{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.th{width:46px;height:56px;border-radius:3px;background:var(--bg) center/cover;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--mute);border:1px solid var(--line)}
.mid{flex:1;min-width:0}
.mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.none{padding:34px 20px;text-align:center;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:none}
.bar.on{display:block}
.bar>div{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .grow{flex:1;font-weight:700}
.bar label{font-size:13px;display:flex;gap:6px;align-items:center}
.bar .btn{background:var(--hi);color:#14213d}
.bar .btn.ghost{background:transparent;color:#fff;border-color:#ffffff55}
dialog{border:0;border-radius:14px;background:var(--paper);color:var(--ink);width:min(480px,94vw);padding:18px}
dialog::backdrop{background:#0008}
dialog label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .grow{flex:1}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.more{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.more .btn{padding:8px 12px;font-size:14px}.bar2{height:10px;background:var(--hi);border-radius:2px;min-width:2px}.cr{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:14px}h3{margin:14px 0 4px}
</style>
</head>
<body>
<main>
<h1>Receipt Box</h1>
<p class="sub">Snap, sort, and bundle card receipts into one PDF. Everything stays on this device.</p>
<div class="add">
<button class="btn" id="bCam">Take photo</button>
<button class="btn ghost" id="bPho">Photos</button>
<button class="btn ghost" id="bPdf">PDFs</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pho" accept="image/*" multiple hidden>
<input type="file" id="pdf" accept="application/pdf" multiple hidden>
<div class="drop" id="drop">Or drop photos and PDFs here</div>
<div class="more"><button class="btn ghost" id="bChart">Charts</button><button class="btn ghost" id="bMatch">Match statement</button><button class="btn ghost" id="bBak">Backup</button><button class="btn ghost" id="bRes">Restore</button><button class="btn ghost" id="bSync">Sync</button><button class="btn ghost" id="bKey">Sync key</button><span class="mute" id="syncSt" style="align-self:center"></span></div>
<input type="file" id="stm" accept=".csv,text/csv" hidden><input type="file" id="rst" accept=".json,application/json" hidden>
<div class="tools">
<input id="q" type="search" placeholder="Search merchant, notes, card" aria-label="Search">
<select id="fc" aria-label="Card"></select>
<select id="fk" aria-label="Category"></select>
<select id="fm" aria-label="Month"></select>
<select id="fg" aria-label="Tag"></select>
</div>
<div class="meta">
<label><input type="checkbox" id="all"> Select all shown</label>
<select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="amt">Highest amount</option></select>
</div>
<div class="meta"><span id="cnt"></span><b id="tot"></b></div>
<div class="tape" id="list" style="margin:14px 0"></div>
</main>

<div class="bar" id="bar"><div>
<span class="grow" id="selInfo"></span>
<label><input type="checkbox" id="cover" checked> Summary page</label>
<button class="btn ghost" id="bCsv">CSV</button>
<button class="btn" id="bExp">Export PDF</button>
<button class="btn ghost" id="bDel">Delete</button>
</div></div>

<dialog id="ed">
<label for="eM" style="margin-top:0">Merchant</label><input id="eM">
<div class="two"><div><label for="eD">Date</label><input id="eD" type="date"></div>
<div><label for="eA">Amount</label><input id="eA" inputmode="decimal" placeholder="0.00"></div></div>
<div class="two"><div><label for="eU">Currency</label><select id="eU"></select></div><div><label for="eO">Other currency code</label><input id="eO" maxlength="3" placeholder="GBP" style="text-transform:uppercase" disabled></div></div>
<div class="two"><div><label for="eC">Card</label><input id="eC" list="cards" placeholder="Visa 4417"></div>
<div><label for="eK">Category</label><select id="eK"></select></div></div>
<datalist id="cards"></datalist>
<label for="eG">Tag</label><select id="eG"></select>
<label for="eN">Notes</label><textarea id="eN" rows="2"></textarea>
<p><button class="btn ghost" id="eR" type="button">Auto-fill from photo</button> <a id="eV" target="_blank" rel="noopener">View original</a></p>
<div class="acts"><button class="btn ghost bad" id="eX">Delete</button><span class="grow"></span><button class="btn ghost" id="eCancel">Cancel</button><button class="btn" id="eS">Save</button></div>
</dialog>
<dialog id="info"><div id="infoBody"></div><div class="acts"><span class="grow"></span><button class="btn" id="infoX">Close</button></div></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const CATS=['Groceries','Dining','Travel','Gas','Shopping','Business','Health','Utilities','Other'];
const CURS=['DKK','EUR','USD','ISK','SEK','NOK'],cc=i=>i.ccy||'DKK';
const money=(n,c='DKK')=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(+n||0)}catch(e){return (+n||0).toFixed(2)+' '+c}};
const plain=(n,c)=>(+n||0).toFixed(2)+' '+c;
const sums=l=>{const m=new Map();l.forEach(i=>m.set(cc(i),(m.get(cc(i))||0)+(+i.amount||0)));return m};
const tots=l=>[...sums(l)].map(([c,v])=>money(v,c)).join(' + ')||money(0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,items=[],sel=new Set(),cur=null;const urls=new Map();
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('receipts',1);r.onupgradeneeded=()=>r.result.createObjectStore('r',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,fn)=>new Promise((res,rej)=>{const t=db.transaction('r',m),q=fn(t.objectStore('r'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const put=o=>tx('readwrite',s=>s.put(o)),del=id=>tx('readwrite',s=>s.delete(id));
const url=(i,k='blob')=>{const key=i.id+k;if(!urls.has(key))urls.set(key,URL.createObjectURL(i[k]));return urls.get(key)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}

async function shrink(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight;
  const draw=(max,q)=>{const s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))};
  return{blob:await draw(2000,.85),thumb:await draw(200,.7)}
}
async function addFiles(files){
  const added=[];
  for(const f of files){
    const pdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
    const o={id:crypto.randomUUID(),name:f.name,added:Date.now(),updated:Date.now(),merchant:'',amount:'',category:'',notes:'',ccy:items.slice().sort((a,b)=>b.added-a.added)[0]?.ccy||'DKK',card:items.slice().sort((a,b)=>b.added-a.added)[0]?.card||'',date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10)};
    try{
      if(pdf){o.type='pdf';o.blob=f}
      else if(f.type.startsWith('image/')||/\.(jpe?g|png|heic|webp)$/i.test(f.name)){o.type='img';Object.assign(o,await shrink(f))}
      else{toast(f.name+' is not a photo or PDF');continue}
      await put(o);items.push(o);added.push(o)
    }catch(e){toast('Could not read '+f.name+'. Try a JPG, PNG, or PDF.')}
  }
  render();if(added.length===1)edit(added[0].id);autosync()
}

function fill(el,label,vals,fmt=x=>x){const v=el.value;el.innerHTML=`<option value="">${label}</option>`+[...new Set(vals)].filter(Boolean).sort().map(x=>`<option value="${esc(x)}">${esc(fmt(x))}</option>`).join('');el.value=[...el.options].some(o=>o.value===v)?v:''}
function filtered(){
  const q=$('#q').value.toLowerCase(),c=$('#fc').value,k=$('#fk').value,m=$('#fm').value,g=$('#fg').value,s=$('#sort').value;
  return items.filter(i=>(!q||(i.merchant+' '+i.notes+' '+i.name+' '+i.card).toLowerCase().includes(q))&&(!c||i.card===c)&&(!k||i.category===k)&&(!m||i.date.startsWith(m))&&(!g||i.tag===g))
   .sort((a,b)=>s==='old'?a.date.localeCompare(b.date):s==='amt'?(+b.amount||0)-(+a.amount||0):b.date.localeCompare(a.date))
}
function render(){
  fill($('#fc'),'All cards',items.map(i=>i.card));fill($('#fk'),'All categories',items.map(i=>i.category));fill($('#fg'),'All tags',items.map(i=>i.tag));
  fill($('#fm'),'All months',items.map(i=>i.date.slice(0,7)),m=>new Date(m+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'}));
  $('#cards').innerHTML=[...new Set(items.map(i=>i.card).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
  const l=filtered();
  $('#list').innerHTML=l.length?l.map(i=>`<div class="row${sel.has(i.id)?' s':''}" data-id="${i.id}" tabindex="0">
   <input type="checkbox" ${sel.has(i.id)?'checked':''} aria-label="Select">
   <div class="th" style="${i.type==='img'?`background-image:url(${url(i,'thumb')})`:''}">${i.type==='pdf'?'PDF':''}</div>
   <div class="mid"><b>${esc(i.merchant||i.name||'Untitled receipt')}</b><span class="mute">${esc([i.date,i.card,i.category,i.tag].filter(Boolean).join(', '))}</span></div>
   <span class="amt">${i.amount?money(i.amount,cc(i)):'No amount'}</span></div>`).join('')
   :`<div class="none">${items.length?'No receipts match these filters.':'No receipts yet. Take a photo or add a PDF to start.'}</div>`;
  $('#cnt').textContent=`${l.length} receipt${l.length===1?'':'s'} shown`;
  $('#tot').textContent=tots(l);
  $('#all').checked=l.length>0&&l.every(i=>sel.has(i.id));
  const n=sel.size;$('#bar').classList.toggle('on',n>0);
  $('#selInfo').textContent=`${n} selected, ${tots(items.filter(i=>sel.has(i.id)))}`;
}

function edit(id){
  cur=items.find(i=>i.id===id);if(!cur)return;
  $('#eK').innerHTML='<option value="">None</option>'+CATS.map(c=>`<option>${c}</option>`).join('');
  $('#eM').value=cur.merchant;$('#eD').value=cur.date;$('#eA').value=cur.amount;$('#eC').value=cur.card;$('#eK').value=cur.category;$('#eN').value=cur.notes;
  $('#eG').innerHTML='<option value="">None</option>'+TAGS.map(c=>`<option>${c}</option>`).join('');$('#eG').value=cur.tag||'';$('#eR').hidden=cur.type!=='img';setCcy(cc(cur));$('#eV').href=url(cur);$('#ed').showModal()
}
$('#eS').onclick=async()=>{
  const cy=$('#eU').value==='Other'?$('#eO').value.trim().toUpperCase():$('#eU').value;if(!/^[A-Z]{3}$/.test(cy))return toast('Enter a 3-letter currency code, like GBP.');Object.assign(cur,{ccy:cy,updated:Date.now(),merchant:$('#eM').value.trim(),date:$('#eD').value||cur.date,amount:$('#eA').value.replace(',','.').replace(/[^0-9.]/g,''),card:$('#eC').value.trim(),category:$('#eK').value,tag:$('#eG').value,notes:$('#eN').value.trim()});
  await put(cur);$('#ed').close();render();autosync()
};
$('#eCancel').onclick=()=>$('#ed').close();
$('#eX').onclick=async()=>{if(confirm('Delete this receipt?')){await remove([cur.id]);$('#ed').close()}};
async function remove(ids){for(const id of ids){await del(id);sel.delete(id);items=items.filter(i=>i.id!==id);queueDel(id)}render();autosync()}

$('#list').onclick=e=>{
  const r=e.target.closest('.row');if(!r)return;const id=r.dataset.id;
  if(e.target.matches('input')){sel.has(id)?sel.delete(id):sel.add(id);render()}else edit(id)
};
$('#list').onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))edit(e.target.dataset.id)};
$('#all').onchange=e=>{filtered().forEach(i=>e.target.checked?sel.add(i.id):sel.delete(i.id));render()};
['q','fc','fk','fm','fg','sort'].forEach(id=>$('#'+id).oninput=render);
$('#bDel').onclick=()=>{if(confirm(`Delete ${sel.size} receipt(s)? This cannot be undone.`))remove([...sel])};

function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)}
const picked=()=>items.filter(i=>sel.has(i.id)).sort((a,b)=>a.date.localeCompare(b.date));
$('#bCsv').onclick=()=>{
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Date','Merchant','Amount','Currency','Card','Category','Tag','Notes'],...picked().map(i=>[i.date,i.merchant,i.amount,cc(i),i.card,i.category,i.tag,i.notes])];
  save(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),'receipts.csv')
};
$('#bExp').onclick=async()=>{
  const list=picked();if(!list.length)return;
  const b=$('#bExp');b.disabled=true;b.textContent='Building…';let bad=0,why='';
  try{
    const{PDFDocument,StandardFonts,rgb}=PDFLib,out=await PDFDocument.create();
    const f=await out.embedFont(StandardFonts.Helvetica),fb=await out.embedFont(StandardFonts.HelveticaBold),font=f;
    const t=s=>String(s||'').replace(/[^\x20-\x7E]/g,'?');
    if($('#cover').checked){
      let pg=out.addPage([612,792]),y=740;
      pg.drawText('Receipt summary',{x:40,y,size:20,font:fb});y-=22;
      pg.drawText(`${list.length} receipts, ${list[0].date} to ${list.at(-1).date}`,{x:40,y,size:10,font,color:rgb(.4,.4,.4)});y-=30;
      for(const i of list){
        if(y<70){pg=out.addPage([612,792]);y=740}
        pg.drawText(i.date,{x:40,y,size:10,font});
        pg.drawText(t(i.merchant||i.name).slice(0,30),{x:110,y,size:10,font});
        pg.drawText(t(i.card).slice(0,14),{x:310,y,size:10,font});
        pg.drawText(t(i.category),{x:390,y,size:10,font});
        const a=i.amount?plain(i.amount,cc(i)):'-';pg.drawText(a,{x:572-f.widthOfTextAtSize(a,10),y,size:10,font});y-=17
      }
      const tt='Total '+[...sums(list)].map(([c,v])=>plain(v,c)).join(' + ');
      pg.drawText(tt,{x:572-fb.widthOfTextAtSize(tt,12),y:y-10,size:12,font:fb})
    }
    for(const i of list){
      try{
        const bytes=await i.blob.arrayBuffer();
        if(i.type==='pdf'){const src=await PDFDocument.load(bytes,{ignoreEncryption:true});(await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p))}
        else{
          const img=await out.embedJpg(bytes),pg=out.addPage([612,792]);
          pg.drawText(t([i.merchant||i.name,i.date,i.amount?plain(i.amount,cc(i)):'',i.card].filter(Boolean).join('  |  ')),{x:36,y:764,size:9,font,color:rgb(.3,.3,.3)});
          const s=Math.min(540/img.width,700/img.height),w=img.width*s,h=img.height*s;
          pg.drawImage(img,{x:(612-w)/2,y:750-h,width:w,height:h})
        }
      }catch(e){bad++;why=e.message}
    }
    save(new Blob([await out.save()],{type:'application/pdf'}),`receipts-${new Date().toISOString().slice(0,10)}.pdf`);
    if(bad)toast(`${bad} file(s) could not be added to the PDF: ${why}`)
  }catch(e){toast('Export failed: '+e.message)}
  b.disabled=false;b.textContent='Export PDF'
};

[['bCam','cam'],['bPho','pho'],['bPdf','pdf']].forEach(([b,i])=>{$('#'+b).onclick=()=>$('#'+i).click();$('#'+i).onchange=e=>{addFiles([...e.target.files]);e.target.value=''}});
addEventListener('dragover',e=>{e.preventDefault();$('#drop').classList.add('on')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop').classList.remove('on')});
addEventListener('drop',e=>{e.preventDefault();$('#drop').classList.remove('on');addFiles([...e.dataTransfer.files])});
const TAGS=['Business','Tax deductible','Reimbursable','Personal'];
const show=h=>{$('#infoBody').innerHTML=h;$('#info').showModal()};
$('#infoX').onclick=()=>$('#info').close();
const bars=(t,m,c)=>{const mx=Math.max(...m.values(),1);return `<h3>${t}</h3>`+[...m].map(([k,v])=>`<div class="cr"><span>${esc(k)}</span><div class="bar2" style="width:${v/mx*100}%"></div><b>${money(v,c)}</b></div>`).join('')};
$('#bChart').onclick=()=>{
  const l=filtered();
  show(l.length?`<p class="mute">Based on the ${l.length} receipts currently shown.</p>`+[...new Set(l.map(cc))].map(c=>{
    const ll=l.filter(i=>cc(i)===c),g=f=>{const m=new Map();ll.forEach(i=>{const k=f(i)||'None';m.set(k,(m.get(k)||0)+(+i.amount||0))});return new Map([...m].sort((a,b)=>b[1]-a[1]))};
    return `<h2>${c}</h2>`+bars('By month',new Map([...g(i=>i.date.slice(0,7))].sort()),c)+bars('By category',g(i=>i.category),c)+bars('By card',g(i=>i.card),c)+bars('By tag',g(i=>i.tag),c)
  }).join(''):'<p>Add receipts with amounts to see charts.</p>')
};
$('#eU').innerHTML=[...CURS,'Other'].map(c=>`<option>${c}</option>`).join('');
const setCcy=c=>{const k=CURS.includes(c);$('#eU').value=k?c:'Other';$('#eO').value=k?'':c;$('#eO').disabled=k};
$('#eU').onchange=()=>{const o=$('#eU').value!=='Other';$('#eO').disabled=o;if(!o)$('#eO').focus()};
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
$('#bBak').onclick=async()=>{
  if(!items.length)return toast('Nothing to back up yet.');
  const out=[];for(const i of items){const o={...i,blob:await b64(i.blob)};if(i.thumb)o.thumb=await b64(i.thumb);out.push(o)}
  save(new Blob([JSON.stringify({v:1,items:out})],{type:'application/json'}),`receipt-box-backup-${new Date().toISOString().slice(0,10)}.json`)
};
$('#bRes').onclick=()=>$('#rst').click();
$('#rst').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());let n=0;
    for(const o of d.items){if(items.some(i=>i.id===o.id))continue;o.blob=await(await fetch(o.blob)).blob();if(o.thumb)o.thumb=await(await fetch(o.thumb)).blob();await put(o);items.push(o);n++}
    render();autosync();toast(`Restored ${n} receipt(s).`)}catch(x){toast('That file is not a Receipt Box backup.')}
};
function csvRows(t){const r=[];let row=[],c='',q=false;for(let k=0;k<t.length;k++){const ch=t[k];if(q){if(ch=='"'&&t[k+1]=='"'){c+='"';k++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[k+1]=='\n')k++;row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=ch}row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}
$('#bMatch').onclick=()=>$('#stm').click();
$('#stm').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rows=csvRows(await f.text()),h=(rows[0]||[]).map(x=>x.toLowerCase());
  const di=h.findIndex(x=>x.includes('date')),ni=h.findIndex(x=>/desc|merchant|payee|name/.test(x)),ai=h.findIndex(x=>/^amount|debit|charge/.test(x));
  if(di<0||ai<0)return show('<p>Could not find Date and Amount columns in the first row of that CSV.</p>');
  const day=s=>{const d=new Date(s);return isNaN(d)?null:d.getTime()/864e5};
  const used=new Set(),miss=[];let ok=0;
  for(const r of rows.slice(1)){
    const amt=Math.abs(parseFloat(String(r[ai]).replace(/[^0-9.\-]/g,''))),d=day(r[di]);
    if(!amt||d==null)continue;
    const m=items.find(i=>!used.has(i.id)&&Math.abs((+i.amount||0)-amt)<.005&&Math.abs(day(i.date)-d)<=4);
    if(m){used.add(m.id);ok++}else miss.push(`<div class="cr"><span>${esc(r[di])}</span><span>${esc(ni>=0?r[ni]:'')}</span><b>${amt.toFixed(2)}</b></div>`)
  }
  show(`<h3>${ok} matched, ${miss.length} without a receipt</h3><p class="mute">A match is the same amount within 4 days.</p>${miss.join('')}`)
};
$('#eR').onclick=async()=>{
  const b=$('#eR');b.disabled=true;b.textContent='Reading…';
  try{
    if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});
    const{data:{text}}=await Tesseract.recognize(cur.blob,'eng');
    const lines=text.split('\n').map(s=>s.trim()).filter(s=>s.length>2);
    const nums=l=>[...l.matchAll(/\d+(?:[.,]\d{3})*[.,]\d{2}(?![.,]?\d)/g)].map(m=>{const t=m[0],d=t.search(/[.,]\d{2}$/);return +(t.slice(0,d).replace(/[.,]/g,'')+'.'+t.slice(d+1))});
    const tl=lines.filter(l=>/total|i alt|\bsum\b|at betale|att betala|samtals|amount due|balance/i.test(l)&&!/sub\s*total|delsum/i.test(l)).flatMap(nums);
    const amt=tl.length?Math.max(...tl):Math.max(0,...lines.flatMap(nums));
    const dm=text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(!$('#eM').value&&lines[0])$('#eM').value=lines[0].slice(0,40);
    if(amt)$('#eA').value=amt.toFixed(2);const cm=text.match(/\b(DKK|EUR|USD|ISK|SEK|NOK)\b/i),cd=cm?cm[1].toUpperCase():/€/.test(text)?'EUR':/\$/.test(text)?'USD':/\bmva\b/i.test(text)?'NOK':/\bvsk\b/i.test(text)?'ISK':'';if(cd)setCcy(cd);
    if(dm){let[,a,c,y]=dm,d=+a,mo=+c;if(mo>12&&d<=12)[d,mo]=[mo,d];y=y.length==2?'20'+y:y;const iso=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(mo<=12&&!isNaN(new Date(iso)))$('#eD').value=iso}
    toast('Filled in what could be read. Check the details before saving.')
  }catch(x){toast('Could not read this photo. Auto-fill needs an internet connection.')}
  b.disabled=false;b.textContent='Auto-fill from photo'
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const key=()=>lsGet('rb-key')||'',st=t=>{$('#syncSt').textContent=t};
const api=(p,o={})=>fetch('/api/'+p,{...o,headers:{...o.headers,Authorization:'Bearer '+key()}}).then(async r=>{if(r.status===401)throw new Error('Wrong sync key');if(!r.ok)throw new Error('Sync server error '+r.status+': '+(await r.text()).slice(0,160));return r});
const queueDel=id=>{if(!key())return;const d=JSON.parse(lsGet('rb-del')||'[]');d.push(id);lsSet('rb-del',JSON.stringify(d))};
let syncing=false;
const autosync=()=>{clearTimeout(autosync.t);autosync.t=setTimeout(sync,800)};
async function sync(manual){
  if(!key()){if(manual===true){const k=prompt('Enter your sync key (the SYNC_KEY you set in Cloudflare)');if(!k)return;lsSet('rb-key',k.trim())}else return}
  if(syncing||!db)return;syncing=true;st('Syncing…');
  try{
    for(const id of JSON.parse(lsGet('rb-del')||'[]'))await api('receipts/'+id,{method:'DELETE'});
    lsSet('rb-del','[]');
    const remote=await(await api('receipts')).json(),rm=new Map(remote.map(r=>[r.id,r]));let changed=false;
    for(const r of remote){
      const l=items.find(i=>i.id===r.id);
      if(r.deleted){if(l&&(l.updated||0)<=r.updated){await del(l.id);items=items.filter(i=>i!==l);sel.delete(l.id);changed=true}continue}
      if(l&&(l.updated||0)>=r.updated)continue;
      const o={...r.data,updated:r.updated};
      if(l){o.blob=l.blob;o.thumb=l.thumb}
      else{o.blob=await(await api(`files/${r.id}?k=blob`)).blob();if(o.type==='img')o.thumb=await(await api(`files/${r.id}?k=thumb`)).blob()}
      await put(o);items=items.filter(i=>i.id!==o.id);items.push(o);changed=true
    }
    for(const l of items){
      const r=rm.get(l.id);
      if(r&&!r.deleted&&(l.updated||0)<=r.updated)continue;
      const up=(k,b)=>api(`files/${l.id}?k=${k}`,{method:'PUT',headers:{'Content-Type':b.type||'application/octet-stream'},body:b});
      if(!r||r.deleted){await up('blob',l.blob);if(l.thumb)await up('thumb',l.thumb)}
      if(!l.updated){l.updated=Date.now();await put(l)}
      const{blob,thumb,...meta}=l;
      await api('receipts/'+l.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)})
    }
    if(changed)render();
    st('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))
  }catch(e){st('Sync failed');toast(e.message==='Failed to fetch'?'Sync needs a connection to the site.':e.message)}
  syncing=false
}
$('#bSync').onclick=()=>sync(true);
$('#bKey').onclick=()=>{const k=prompt('Sync key (leave empty to turn sync off on this device)',key());if(k===null)return;lsSet('rb-key',k.trim());st(k.trim()?'':'Sync off');if(k.trim())sync()};
addEventListener('online',autosync);addEventListener('focus',autosync);
(async()=>{try{db=await open();items=await tx('readonly',s=>s.getAll())||[]}catch(e){toast('Storage is blocked in this browser mode. Receipts will not be saved.')}render();autosync()})();
</script>
