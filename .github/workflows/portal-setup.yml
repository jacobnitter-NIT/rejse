name: Verify portal account setup
on:
  push:
    branches: [main]
    paths: ['portal-server.js', '.github/workflows/portal-setup.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deployed setup endpoint
        shell: python
        run: |
          import json, time, urllib.request
          for attempt in range(24):
              try:
                  with urllib.request.urlopen('https://rejse-9wn.pages.dev/api/portal/auth/setup-key', timeout=15) as response:
                      result = json.load(response)
                  if result.get('publicKey') or result.get('complete'):
                      print('PORTAL_SETUP_RESULT=' + json.dumps(result, separators=(',', ':')))
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Deployed setup endpoint was not ready')
